<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./image-slot.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--white);padding:56px 0 60px">
<div style="padding:0 24px">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker">Dress Code</x-import>
<div style="font:800 36px/1.05 var(--font-display);color:var(--ink);margin-top:14px">Come Colorido.</div>
<div style="font:500 14px var(--font-body);color:var(--text-muted);margin-top:8px">Summer &amp; colorful vibes</div>
</div>
<div style="display:flex;gap:12px;overflow-x:auto;padding:26px 24px 8px;scroll-snap-type:x proximity;cursor:grab">
<div style="flex:0 0 62%;aspect-ratio:3/4;scroll-snap-align:start;border-radius:var(--radius-sharp);overflow:hidden;border:2px solid var(--ink)"><image-slot id="dc-1" shape="rect" placeholder="Look 1"></image-slot></div>
<div style="flex:0 0 62%;aspect-ratio:3/4;scroll-snap-align:start;border-radius:var(--radius-sharp);overflow:hidden;border:2px solid var(--ink)"><image-slot id="dc-2" shape="rect" placeholder="Look 2"></image-slot></div>
<div style="flex:0 0 62%;aspect-ratio:3/4;scroll-snap-align:start;border-radius:var(--radius-sharp);overflow:hidden;border:2px solid var(--ink)"><image-slot id="dc-3" shape="rect" placeholder="Look 3"></image-slot></div>
<div style="flex:0 0 62%;aspect-ratio:3/4;scroll-snap-align:start;border-radius:var(--radius-sharp);overflow:hidden;border:2px solid var(--ink)"><image-slot id="dc-4" shape="rect" placeholder="Look 4"></image-slot></div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => {
    if (!el || this._obs) return;
    this._obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); }
    }, { threshold: 0.15 });
    this._obs.observe(el);
  };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() {
    return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:translateY(0);transition:opacity .7s var(--ease-standard),transform .7s var(--ease-standard)' : 'opacity:0;transform:translateY(24px)' };
  }
}

</script>
</body>
</html>
