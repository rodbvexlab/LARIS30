<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--warm-cream);padding:64px 24px;text-align:center">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker" align="center">Rateio</x-import>
<div style="font:900 96px/0.9 var(--font-display);color:var(--coral);margin-top:12px;text-shadow:5px 5px 0 var(--ink)">R$85</div>
<div style="font:400 18px/1.5 var(--font-serif);color:var(--ink);margin-top:18px;max-width:320px;margin-left:auto;margin-right:auto">A contribuição ajuda a cobrir a estrutura compartilhada da festa.</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => { if (!el || this._obs) return; this._obs = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); } }, { threshold: 0.2 }); this._obs.observe(el); };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() { return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:scale(1);transition:opacity .6s var(--ease-pop),transform .6s var(--ease-pop)' : 'opacity:0;transform:scale(0.92)' }; }
}

</script>
</body>
</html>
