<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--white);padding:8px 24px 56px">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker">What's Included</x-import>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px">
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Chácara</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body);background:var(--sun-yellow)">Churrasco</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Acompanhamentos</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body);background:var(--accent-blush)">Frutas / Sobremesa</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Welcome Drink</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body);background:var(--pool-blue)">Água</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Refrigerante / Suco</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Gelo</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body);background:var(--bubblegum);color:#fff">Decoração / Estrutura</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:8px 16px;font:600 13px var(--font-body)">Mimos</span>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => { if (!el || this._obs) return; this._obs = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); } }, { threshold: 0.2 }); this._obs.observe(el); };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() { return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:translateY(0);transition:opacity .6s var(--ease-standard),transform .6s var(--ease-standard)' : 'opacity:0;transform:translateY(20px)' }; }
}

</script>
</body>
</html>
