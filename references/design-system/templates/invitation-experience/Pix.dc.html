<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--white);padding:56px 24px;text-align:center">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker" align="center">PIX</x-import>
<div style="font:900 56px var(--font-display);color:var(--ink);margin-top:12px">R$85</div>
<div style="font:600 12px var(--font-body);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-top:14px">Chave Pix · Em Breve</div>
<div style="margin-top:18px;display:flex;justify-content:center">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.Button" variant="{{ btnVariant }}" size="lg" on-click="{{ copy }}" hint-size="220,56">{{ btnLabel }}</x-import>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false, copied: false };
  setRef = (el) => { if (!el || this._obs) return; this._obs = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); } }, { threshold: 0.2 }); this._obs.observe(el); };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); if (this._t) clearTimeout(this._t); }
  copy = () => { this.setState({ copied: true }); this._t = setTimeout(() => this.setState({ copied: false }), 2200); };
  renderVals() {
    return {
      setRef: this.setRef,
      wrap: this.state.on ? 'opacity:1;transform:translateY(0);transition:opacity .6s var(--ease-standard),transform .6s var(--ease-standard)' : 'opacity:0;transform:translateY(20px)',
      btnLabel: this.state.copied ? "Pix Copiado ✓" : 'Copiar Chave Pix',
      btnVariant: this.state.copied ? 'secondary' : 'primary',
      copy: this.copy
    };
  }
}

</script>
</body>
</html>
