<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};position:relative;overflow:hidden;background:repeating-conic-gradient(from 0deg,var(--coral) 0deg 12deg,var(--summer-orange) 12deg 24deg);padding:72px 24px;text-align:center">
<div style="font:800 34px/1.1 var(--font-display);color:var(--warm-cream);text-shadow:3px 3px 0 var(--ink)">See You<br>By The Pool</div>
<div style="display:flex;justify-content:center;margin:24px 0">
<div style="width:76px;height:76px" class="chrome-sphere"></div>
</div>
<div style="font:900 44px var(--font-display);color:var(--ink)">LARIS 30</div>
<div style="font:600 13px var(--font-body);letter-spacing:0.25em;text-transform:uppercase;color:var(--sun-yellow);margin-top:6px;text-shadow:1.5px 1.5px 0 var(--ink)">In Full Color</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => { if (!el || this._obs) return; this._obs = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); } }, { threshold: 0.2 }); this._obs.observe(el); };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() { return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:scale(1);transition:opacity .8s var(--ease-standard),transform .8s var(--ease-standard)' : 'opacity:0;transform:scale(0.96)' }; }
}

</script>
</body>
</html>
