<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--warm-cream);padding:56px 24px;display:flex;flex-direction:column;gap:18px">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker">Party Info</x-import>
<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:14px">
<span style="font:700 13px var(--font-body);letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted)">Data</span>
<span style="font:800 26px var(--font-display);color:var(--ink)">22 Ago 2026</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:14px">
<span style="font:700 13px var(--font-body);letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted)">Horário</span>
<span style="font:800 26px var(--font-display);color:var(--coral)">Em Breve</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font:700 13px var(--font-body);letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted)">Local</span>
<span style="font:800 26px var(--font-display);color:var(--ink);text-align:right">Chácara<br><span style="font:600 13px var(--font-body);color:var(--text-muted)">Endereço em breve</span></span>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => {
    if (!el || this._obs) return;
    this._obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); }
    }, { threshold: 0.2 });
    this._obs.observe(el);
  };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() {
    return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:translateY(0);transition:opacity .7s var(--ease-standard),transform .7s var(--ease-standard)' : 'opacity:0;transform:translateY(24px)' };
  }
}

</script>
</body>
</html>
