<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div ref="{{ setRef }}" style="{{ wrap }};background:var(--accent-blush);padding:56px 24px;text-align:center">
<x-import component-from-global-scope="LARI30DesignSystem_0ed06a.SectionKicker" align="center">Location</x-import>
<div style="font:800 32px/1.1 var(--font-display);color:var(--ink);margin-top:12px">Chácara</div>
<div style="font:600 15px var(--font-body);color:var(--ink);margin-top:4px">São Paulo</div>
<div style="font:500 13px var(--font-body);color:var(--text-muted);margin-top:6px">Endereço em breve</div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:22px">
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:12px 20px;font:700 13px var(--font-body);opacity:0.45">Abrir No Maps</span>
<span style="border:2px solid var(--ink);border-radius:var(--radius-pill);padding:12px 20px;font:700 13px var(--font-body);opacity:0.45">Abrir No Waze</span>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false };
  setRef = (el) => { if (!el || this._obs) return; this._obs = new IntersectionObserver((e) => { if (e[0].isIntersecting) { this.setState({ on: true }); this._obs.disconnect(); } }, { threshold: 0.2 }); this._obs.observe(el); };
  componentWillUnmount(){ if (this._obs) this._obs.disconnect(); }
  renderVals() { return { setRef: this.setRef, wrap: this.state.on ? 'opacity:1;transform:translateY(0);transition:opacity .6s var(--ease-standard),transform .6s var(--ease-standard)' : 'opacity:0;transform:translateY(20px)' }; }
}

</script>
</body>
</html>
